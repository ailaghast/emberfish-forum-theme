# Theme settings are sent to every visitor's browser, so nothing here (not
# even a default) may name a game before it is public. A game's hall comes
# from its category (see INSTALL.md); its line in hall_details is added in
# the admin on the day the game is revealed.

nav_rules_url:
  type: string
  default: "/guidelines"
  description: "Where the Rules link in the top bar goes."

nav_website_url:
  type: string
  default: "https://emberfishgames.com"
  description: "Where the Website link in the top bar goes."

hall_details:
  type: list
  list_type: simple
  default: "hadean-tactics;Out now · Moonhunter DLC;The original deckbuilding auto-battler. Defeat the Six Wings.;Buy on Steam;https://store.steampowered.com/app/1260590/Hadean_Tactics/"
  description: "Words and buttons for each game hall, one line per game: category-slug;tagline;one-sentence pitch;button text;button link;second button text;second button link. Leave a part empty to skip it (the second button is optional). Don't use ; or | inside the text. A game's art comes from its category's Images, not from here."

hall_newsletter:
  type: list
  list_type: simple
  default: "black-flame;10145451|hadean-tactics;10145464"
  description: "A Get news by email button for each game hall's banner, one line per game: category-slug;the number of that game's forum Kit form. Clicking it opens an email field in its place, which signs up to that form without leaving the forum. The number is in the form's address in Kit (app.kit.com/forms/designers/NUMBER/edit); pasting that address works too, but Kit's share links don't. The button comes after the hall_details buttons and doesn't show on the lobby door. A game without a line gets no button. Like hall_details, add a game's line only when the game is public."

lobby_newsletter:
  type: string
  default: "The big dates, by email.;Demos, playtests, launches and big sales for all our games. Only the big moments.;10145476"
  description: "The newsletter strip on the lobby, under the announcement bar, for news about all of Emberfish Games' games: bold first words;the rest of the sentence;the number of the studio's forum Kit form. It has an email field and a Keep me posted button that sign up without leaving the forum. The number is in the form's address in Kit (app.kit.com/forms/designers/NUMBER/edit); pasting that address works too, but Kit's share links don't. It shows only once there's a form, and visitors can't close it. Don't use ; inside the text. Each game's own form is hall_newsletter."

signup_newsletter:
  type: string
  default: "Newsletter;10145476"
  description: "The newsletter checkbox on the signup form: the name of the checkbox user field (Admin → Users → User fields);the number of the Kit form it signs up to. A new account with the box ticked is sent to that form, and Kit emails its usual confirmation. Kit can't be told when a member unticks the box later, so check that before each send (INSTALL.md, Newsletter signups). The number is in the form's address in Kit (app.kit.com/forms/designers/NUMBER/edit); pasting that address works too, but Kit's share links don't. Leave the number out to stop sending signups to Kit."

support_category:
  type: string
  default: "support"
  description: "Slug of the forum-wide Support parent category. It gets the Support tab in the halls bar and the Support panel on hall pages, and is never shown as a game hall."

hall_sections:
  type: list
  list_type: simple
  default: "Official;announcements,patch-notes,news|Community;general,strategy,fan-art-clips|*|Help us build it;feedback,bug-reports,bugs-feedback,playtest"
  description: "How a hall page groups its forums, one section per line: Section name;subcategory-slug,subcategory-slug. The same lines serve every game: each hall shows the slugs it has, in this order, and skips the rest. A forum with forums of its own (such as a DLC) becomes a section named after it, placed at the line that is just *. Forums that fit no line go in a last 'Forums' section."

category_icons:
  type: list
  list_type: simple
  default: "forum-help:circle-question|forum-feedback:comment"
  description: "Icon for forums without a Logo image, as category-slug:icon-name. New icon names must also be added to svg_icons in about.json. A category's own icon (category settings) is used when it has one."

latest_count:
  type: integer
  default: 5
  min: 3
  max: 12
  description: "How many topics a hall page's Latest posts panel lists."

show_stats:
  type: bool
  default: true
  description: "Show the Forum stats panel on hall pages."

share_networks:
  type: list
  list_type: simple
  default: "x|reddit|facebook|whatsapp|weibo|email"
  description: "Share buttons on hall pages (they share the hall's link). Choices: x, reddit, facebook, whatsapp, weibo, email."

share_text:
  type: string
  default: "Join the Emberfish Games forums"
  description: "Text that goes with shared links."

hide_profile_location:
  type: bool
  default: true
  description: "Hide the Location field from profile settings, profiles and user cards."

hide_profile_bio:
  type: bool
  default: false
  description: "Hide the About me (bio) field from profile settings, profiles and user cards."

content_width:
  type: integer
  default: 1280
  min: 1000
  max: 1600
  description: "Maximum width of the forum's content, in pixels (Discourse's default is 1110)."
